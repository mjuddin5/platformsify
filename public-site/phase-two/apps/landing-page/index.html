<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Platformsify – Empowering Digital Evolution</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      color: #f1f5f9;
      text-align: center;
    }
    img {
      width: 140px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
      color: #38bdf8;
    }
    p {
      font-size: 1.2rem;
      margin: 10px 0 30px;
      color: #94a3b8;
    }
    a.button {
      text-decoration: none;
      color: white;
      background: linear-gradient(to right, #f43f5e, #3b82f6, #10b981);
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }
    a.button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <img src="logo.svg" alt="Platformsify Logo" />
  <h1>Platformsify is Coming Soon</h1>
  <p>Empowering Digital Evolution – Our vision is nearly ready. Stay tuned.</p>
  <a href="mailto:contact@platformsify.com" class="button">Contact Us</a>
</body>
</html>
